[project]
name = "entropy-data"
version = "0.3.20"
description = "CLI for Entropy Data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Entropy Data", email = "support@entropy-data.com" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "entropy-data",
    "data-product",
    "data-contract",
    "odcs",
    "odps",
    "data-marketplace",
    "data-mesh",
    "data-governance",
    "data-catalog",
    "cli",
]
dependencies = [
    "typer>=0.15.0,<1.0",
    "rich>=14.0,<16.0",
    "pydantic>=2.10,<3.0",
    "requests>=2.33,<3.0",
    "tomli_w>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "truststore>=0.10,<1.0",
]

[project.urls]
Homepage = "https://entropy-data.com"
Documentation = "https://docs.entropy-data.com"
Repository = "https://github.com/entropy-data/entropy-data-cli"
Issues = "https://github.com/entropy-data/entropy-data-cli/issues"
Changelog = "https://github.com/entropy-data/entropy-data-cli/blob/main/CHANGELOG.md"

[project.scripts]
entropy-data = "entropy_data.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "responses>=0.25",
    # 0.16 changes the default lint rule set and the formatter style; adopting it is a separate migration.
    "ruff>=0.8,<0.16",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entropy_data"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
