on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

name: CI
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # setup-uv no longer publishes floating major tags, so pin the exact version.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Check formatting
        run: uv run ruff check
      - name: Run tests
        run: uv run pytest

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.12'
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync
      - name: Test entropy-data --help
        run: uv run entropy-data --help
      - name: Test entropy-data --version
        run: uv run entropy-data --version

  docker:
    runs-on: ubuntu-latest
    needs:
      - test
    if: github.event_name != 'pull_request' && github.repository == 'entropy-data/entropy-data-cli'
    permissions:
      contents: read
      id-token: write # Mint the OIDC token that keyless cosign signing exchanges for a Fulcio certificate.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            entropydata/entropy-data-cli
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: entropydata/entropy-data-cli:snapshot-latest
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      # cosign-installer publishes no floating major tag, so this must name an
      # exact version.
      - uses: sigstore/cosign-installer@v4.1.2
        if: github.ref == 'refs/heads/main'

      # Sign the index digest rather than a tag: the index commits to the
      # platform manifests and the SBOM/provenance attestations, so one
      # signature covers all of them, and the binding cannot be moved by
      # retagging. Only reachable when the image was actually pushed — the
      # release workflow calls this workflow on a tag, where push is false.
      - name: Sign image
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "entropydata/entropy-data-cli@${DIGEST}"
